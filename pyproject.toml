description = "Project to store the pelican source of my blog"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "invoke>=2.2.1",
    "pelican-pandoc-reader>=3.0.0",
    "pelican[markdown]>=4.11.0.post0",
]

[dependency-groups]
dev = [
    "black>=25.12.0",
    "isort>=7.0.0",
    "ruff>=0.14.8",
]
